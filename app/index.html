<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Cover Art Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="editor-container">
    <!-- Left Controls Panel -->
    <div class="controls-panel">
      <div class="brand-header">Cover Art Studio</div>

      <!-- Photos Section -->
      <div class="section-group">
        <h3>Source Photos</h3>
        <label for="photo" class="file-upload-label">Upload Photos (Up to 5)</label>
        <input type="file" id="photo" accept="image/*" multiple>
        <div style="margin-top: 10px;">
          <label style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block;">Select Panel to Edit / Assign Photo:</label>
          <div id="panel-slots" class="panel-slots-container">
            <!-- Dynamically populated panel slots -->
          </div>
        </div>
      </div>

      <!-- Layout Section -->
      <div class="section-group">
        <h3>Layout Style</h3>
        <div class="btn-grid cols-2">
          <button class="layout-btn active" data-layout="hero">Hero Left</button>
          <button class="layout-btn" data-layout="grid5">Grid 5</button>
          <button class="layout-btn" data-layout="overlay">Title Overlay</button>
          <button class="layout-btn" data-layout="band">Band Bottom</button>
          <button class="layout-btn" data-layout="strip">Film Strip</button>
          <button class="layout-btn" data-layout="duo">Duo Split</button>
          <button class="layout-btn" data-layout="popout">Pop-Out Hero</button>
        </div>
      </div>

      <!-- Grade Section -->
      <div class="section-group">
        <h3>Poster Ink Grade</h3>
        <div class="btn-grid cols-2">
          <button class="grade-btn active" data-grade="heatwave">Heatwave</button>
          <button class="grade-btn" data-grade="golden">Golden Coast</button>
          <button class="grade-btn" data-grade="neon">Neon Vice</button>
          <button class="grade-btn" data-grade="noir">Noir Teal</button>
          <button class="grade-btn" data-grade="mono">Mono Ink</button>
          <button class="grade-btn" data-grade="vice">Vice Nights</button>
          <button class="grade-btn" data-grade="midnight">Midnight</button>
          <button class="grade-btn" data-grade="chrome">Chrome</button>
          <button class="grade-btn" data-grade="sunset">Sunset Dusk</button>
        </div>
      </div>

      <!-- Typography & Text Section -->
      <div class="section-group">
        <h3>Poster Copy</h3>
        <div class="input-group">
          <label for="title">Title</label>
          <input type="text" id="title" value="SUNSET HEIST">
        </div>
        <div class="input-group">
          <label for="subtitle">Subtitle</label>
          <input type="text" id="subtitle" value="Coastline Nights">
        </div>
        <div class="input-group">
          <label for="tagline">Tagline</label>
          <input type="text" id="tagline" value="ONE LAST SCORE — SUMMER 2026">
        </div>
        <div class="input-group">
          <label for="badge">Badge Text</label>
          <input type="text" id="badge" value="EST. 2026">
        </div>
        <div class="input-group">
          <label for="cast">Cast (comma separated)</label>
          <input type="text" id="cast" value="LUCIA, JASON, RAUL">
        </div>
        <div class="input-group">
          <label for="review">Review Quote</label>
          <input type="text" id="review" value="&quot;A NEON MASTERPIECE&quot; — VICE DAILY">
        </div>
        <div class="input-group">
          <label for="stars">Star Rating</label>
          <select id="stars">
            <option value="5" selected>5 Stars</option>
            <option value="4">4 Stars</option>
            <option value="3">3 Stars</option>
            <option value="2">2 Stars</option>
            <option value="1">1 Star</option>
            <option value="0">0 Stars</option>
          </select>
        </div>
      </div>

      <!-- Zoom & Panel Adjust -->
      <div class="section-group">
        <h3>Panel View Adjust</h3>
        <div class="zoom-export-row">
          <button id="zoom-in" class="action-btn" style="flex:1;">Zoom +</button>
          <button id="zoom-out" class="action-btn" style="flex:1;">Zoom -</button>
        </div>
      </div>

      <!-- Export Section -->
      <div class="section-group" style="border-bottom: none;">
        <h3>Export Cover Art</h3>
        <button id="export-square" class="export-btn">Export Square (1080x1080)</button>
        <button id="export-tall" class="export-btn">Export Tall (1080x1350)</button>
        <button id="export-wide" class="export-btn">Export Wide (1920x1080)</button>
      </div>

      <!-- Status Line -->
      <div id="status" class="status-line">Ready</div>
    </div>

    <!-- Right Canvas Area -->
    <div class="canvas-area">
      <div class="canvas-wrapper">
        <canvas id="cover" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
